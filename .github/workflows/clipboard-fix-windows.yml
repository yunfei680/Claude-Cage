name: Cage fixes Windows installer
# Builds only the unsigned Windows installer for these branches with the
# repository's own Windows build workflow. No signing secrets are used.
on:
  push:
    branches: [clipboard-fix, smooth]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    uses: ./.github/workflows/windows-build.yml
    with:
      ref: ${{ github.sha }}
      release: false
      artifact_name: cage-windows-${{ github.ref_name }}
      all_windows_versions: false
